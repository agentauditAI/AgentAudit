# Tests only — no secrets, no private keys, no deploy steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: forge build
        run: forge build

      - name: forge test
        run: forge test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      # Strict typecheck incl. structural compatibility with MnemoPay's OnChainAnchorSink
      - name: typecheck packages/mnemopay-anchor
        run: npx tsc -p packages/mnemopay-anchor/tsconfig.json --noEmit

      - name: typecheck + build tools/verify
        run: |
          npx tsc -p tools/verify/tsconfig.json --noEmit
          npx tsc -p tools/verify/tsconfig.build.json

      # test/sdk/*.anvil.test.ts, packages/*/test/*.anvil.test.ts and
      # tools/*/test/*.anvil.test.ts need anvil (Foundry) + out/ from forge
      # build; AGENTAUDIT_SKIP_ANVIL is deliberately unset so the integration
      # tests run.
      - name: jest
        run: npx jest
