# Tests only — no secrets, no private keys, no deploy steps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # contracts/v3/ is pinned to solc 0.8.38 (foundry.toml compilation_restrictions),
      # which forge v1.7.1 cannot auto-install; checksum-verified official binary.
      - name: install solc 0.8.38 (v3 profile)
        run: ./scripts/install-solc.sh

      # Builds both profiles: default (0.8.35, existing contracts) and v3 (0.8.38, prague)
      - name: forge build
        run: forge build

      - name: check v3 profile artifact
        run: |
          jq -e '.metadata.compiler.version == "0.8.38+commit.1835d247" and .metadata.settings.evmVersion == "prague"' out/AuditVaultV3.sol/AuditVaultV3.json
          jq -e '.metadata.compiler.version == "0.8.35+commit.47b9dedd"' out/AuditVault.sol/AuditVault.json

      - name: forge test
        run: forge test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      # Deploy scripts compile with Hardhat: 0.8.20 for v1/v2, per-file
      # overrides to 0.8.38/prague for contracts/v3/ (hardhat.config.js)
      - name: hardhat compile
        run: npx hardhat compile

      # Strict typecheck incl. structural compatibility with MnemoPay's OnChainAnchorSink
      - name: typecheck packages/mnemopay-anchor
        run: npx tsc -p packages/mnemopay-anchor/tsconfig.json --noEmit

      - name: typecheck + build tools/verify
        run: |
          npx tsc -p tools/verify/tsconfig.json --noEmit
          npx tsc -p tools/verify/tsconfig.build.json

      - name: typecheck src/mcp-server.ts
        run: npx tsc --noEmit --esModuleInterop --skipLibCheck --module commonjs --target es2020 --moduleResolution node src/mcp-server.ts

      # Compiled @agentauditai/mcp-server (plain node, no ts-node): build, start
      # the bin over stdio, and check the tarball contents. Never publishes.
      - name: build + smoke + pack check packages/mcp-server
        working-directory: packages/mcp-server
        run: |
          npm run build
          npm run smoke
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = require(process.env.RUNNER_TEMP + "/pack.json")[0].files.map((f) => f.path);
            const bad = files.filter((f) => /(^|\/)\.env|\.test\.|(^|\/)test\/|\.ts$/.test(f) && !f.endsWith(".d.ts"));
            console.log(files.join("\n"));
            if (bad.length) { console.error("unexpected files in tarball:", bad); process.exit(1); }
          '

      # test/sdk/*.anvil.test.ts, test/mcp/*.anvil.test.ts, packages/*/test/*.anvil.test.ts
      # and tools/*/test/*.anvil.test.ts need anvil (Foundry) + out/ from forge
      # build; AGENTAUDIT_SKIP_ANVIL is deliberately unset so the integration
      # tests run.
      - name: jest
        run: npx jest
