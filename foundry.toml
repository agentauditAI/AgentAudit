[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
# Remappings are recorded in every contract's metadata (and so in its bytecode),
# even context-scoped ones. Keep exactly the pre-v3 list; contracts/v3/ imports
# OpenZeppelin by relative path (lib/openzeppelin-contracts/contracts/...).
auto_detect_remappings = false
remappings = ["forge-std/=lib/forge-std/src/"]

# AuditVault v3 (docs/design/AUDITVAULT_V3.md §9): solc 0.8.38 exact, evm prague
# (Celo rejects osaka's CLZ). Scoped to contracts/v3/** so nothing else changes.
additional_compiler_profiles = [
    { name = "v3", via_ir = true, optimizer = true, optimizer_runs = 200, evm_version = "prague" },
]
compilation_restrictions = [
    { paths = "contracts/v3/**", version = "=0.8.38", via_ir = true, optimizer_runs = 200, evm_version = "prague" },
    # Everything else keeps the compiler it was built and verified with
    # (auto-detect picked 0.8.35, default evm osaka); pinned so installing
    # 0.8.38 cannot move it.
    { paths = "contracts/v2/**", version = "=0.8.35" },
    { paths = "src/**", version = "=0.8.35" },
    { paths = "script/**", version = "=0.8.35" },
]
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "./fixtures/auditvault-v3" }]
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
