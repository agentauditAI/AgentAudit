[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentauditai-sdk"
version = "2.0.0"
description = "On-chain EU AI Act compliance SDK for AI agents — immutable audit logs, KYA registration, incident reporting, post-market monitoring across 5 EVM networks."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "agentauditAI" }]
requires-python = ">=3.9"
keywords = [
    "eu-ai-act",
    "compliance",
    "blockchain",
    "audit",
    "ai-agents",
    "mantle",
    "arbitrum",
    "base",
    "optimism",
    "polygon",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]
dependencies = [
    "web3>=6.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://getagentaudit.xyz"
Repository = "https://github.com/agentauditAI/AgentAudit"
"Bug Tracker" = "https://github.com/agentauditAI/AgentAudit/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentauditai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
